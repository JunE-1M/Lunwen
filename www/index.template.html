<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>AI 论文档案库 · 内容直读</title>
<style>
  :root{
    --bg:#0a0912; --panel:#12101a; --panel-2:#0f0d16;
    --ink:#e7e3f5; --muted:#8a85a0; --ink-3:#5a556a;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --accent:#a78bfa; --accent-d:#7c3aed; --accent-soft:rgba(167,139,250,.12); --accent-glow:rgba(167,139,250,.5);
    --x:#c4b5fd; --x-soft:rgba(196,181,253,.08);
    --research:#7dd3fc; --research-soft:rgba(125,211,252,.07);
    --media:#fcd34d; --media-soft:rgba(252,211,77,.07);
    --hf:#6ee7b7; --hf-soft:rgba(110,231,183,.07);
    --purple:#a78bfa; --purple-d:#7c3aed; --purple-soft:rgba(167,139,250,.12);
    --grad:linear-gradient(135deg,#a78bfa,#7c3aed);
    --shadow:0 8px 30px rgba(0,0,0,.4); --radius:12px;
    --font-tech:"SF Mono","JetBrains Mono","Fira Code","Roboto Mono",ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(circle at 13px 13px, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/24px 24px,
      radial-gradient(ellipse 90% 55% at 50% -5%, rgba(124,58,237,.13), transparent 70%),
      #0a0912;
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:60px;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 22px}

  /* ---------- Hero / 顶栏 ---------- */
  header.hero{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#0c0a14,#0a0912); border-bottom:.5px solid var(--line);
    color:var(--ink);padding:42px 0 30px;
  }
  header.hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 55% 80% at 18% -10%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(ellipse 50% 70% at 92% 8%, rgba(167,139,250,.13), transparent 65%);
  }
  .hero-flow{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.6}
  .hero-flow svg{position:absolute;width:120%;height:220%;left:-10%;top:-80%}
  .hero-flow .l1{animation:flowA 16s ease-in-out infinite}
  .hero-flow .l2{animation:flowB 20s ease-in-out infinite}
  @keyframes flowA{0%,100%{transform:translate3d(-5%,0,0)}50%{transform:translate3d(5%,-6px,0)}}
  @keyframes flowB{0%,100%{transform:translate3d(4%,3px,0)}50%{transform:translate3d(-4%,-3px,0)}}
  .hero .wrap{position:relative;z-index:2}
  .hero-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:.5px solid rgba(167,139,250,.10)}
  .brand{display:flex;align-items:center;gap:11px}
  .lgo{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow),0 0 3px #c4b5fd;flex:none}
  .brand .b-title{height:11px;width:148px;border-radius:3px;background:linear-gradient(90deg,rgba(231,227,245,.30),rgba(231,227,245,.08))}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    display:flex;flex-direction:column;gap:5px;padding:8px 12px;border-radius:10px;
    background:rgba(255,255,255,.025);border:.5px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);position:relative;min-width:86px;overflow:hidden
  }
  .chip::before{content:"";position:absolute;left:0;top:0;width:20px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  .chip .k{font-size:10.5px;opacity:.6;letter-spacing:.1em;text-transform:uppercase;font-weight:400;height:12px;display:flex;align-items:center}
  .chip .k-bar{height:3px;width:34px;border-radius:2px;background:rgba(231,227,245,.18)}
  .chip .v{font-size:24px;font-weight:200;color:#f4f0ff;font-variant-numeric:tabular-nums;font-family:var(--font-tech);letter-spacing:.5px;text-shadow:0 0 12px rgba(167,139,250,.4)}
  .chip .sub{font-size:10.5px;opacity:.4;font-weight:300}
  .chip .spark{height:15px;width:48px;margin-top:2px}
  .chip.clickable{cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
  .chip.clickable:hover{transform:translateY(-2px);background:rgba(255,255,255,.04);border-color:var(--line-2)}
  .chip.pdf{background:rgba(167,139,250,.06)!important;border-color:rgba(167,139,250,.28)!important}
  .chip.pdf .v{color:#fff}
  .chip .go{position:absolute;right:10px;top:9px;font-size:9.5px;font-weight:400;opacity:.55;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

  /* ---------- 玻璃工具栏 ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;margin:16px auto 0;max-width:1100px;padding:0 22px;
  }
  .toolbar-inner{
    display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:14px;
    background:rgba(18,16,28,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;box-shadow:0 8px 28px rgba(0,0,0,.4)
  }
  .toolbar-inner::before{
    content:"";position:absolute;inset:0;border-radius:14px;padding:1px;
    background:linear-gradient(135deg,rgba(167,139,250,.45),rgba(124,58,237,.06) 55%,rgba(167,139,250,.2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none
  }
  .search{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.03);border:.5px solid var(--line);min-width:200px;flex:1;max-width:340px}
  .search svg{flex:none}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13px;font-weight:300;font-family:inherit}
  .search input::placeholder{color:var(--ink-3)}
  .pills{display:flex;gap:7px}
  .fbtn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:.5px solid var(--line);background:rgba(255,255,255,.02);
    color:var(--muted);font-size:12px;font-weight:400;padding:6px 13px;border-radius:999px;transition:all .2s;font-family:var(--font-tech);letter-spacing:.04em}
  .fbtn span{background:rgba(167,139,250,.1);color:#c4b5fd;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:500}
  .fbtn:hover{border-color:var(--line-2);color:#d4d0e0}
  .fbtn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 0 1px rgba(167,139,250,.4),0 0 14px rgba(167,139,250,.4)}
  .fbtn.active span{background:rgba(255,255,255,.2);color:#fff}
  .tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .sort{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:.5px solid var(--line);color:var(--muted);font-size:11.5px;font-family:var(--font-tech);cursor:pointer;transition:border-color .2s,color .2s}
  .sort:hover{border-color:var(--line-2);color:#d4d0e0}
  .vt{display:flex;gap:4px}
  .vbtn{width:30px;height:26px;border-radius:7px;border:.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.015);transition:border-color .2s,background .2s}
  .vbtn:hover{border-color:var(--line-2)}
  .vbtn.a{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08);color:#c4b5fd}

  /* ---------- Layout ---------- */
  .archive{display:grid;grid-template-columns:160px 1fr;gap:20px;margin-top:18px;align-items:start}
  .side{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 80px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-right:4px}
  .side::-webkit-scrollbar{width:4px}
  .side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}

  .snav{position:relative;padding-left:16px}
  .snav::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:linear-gradient(180deg,rgba(167,139,250,.6),rgba(167,139,250,.05))}
  .tl-date{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:13px;cursor:pointer;transition:color .2s,transform .15s}
  .tl-date:hover{transform:translateX(2px)}
  .tl-date::before{content:"";position:absolute;left:-15px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(167,139,250,.7)}
  .tl-date.dim::before{background:#3a2f5a;box-shadow:none}
  .tl-date .dy{font-family:var(--font-tech);font-size:11.5px;font-weight:400;color:#c4b5fd;letter-spacing:.3px}
  .tl-date .small{font-size:10px;color:var(--ink-3);font-family:var(--font-tech);margin-left:auto}
  .tl-date.dim .dy{color:var(--muted)}

  .side-title{font-size:10px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-bottom:9px}
  .tagcloud{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:.5px solid rgba(167,139,250,.18);background:rgba(167,139,250,.05);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
  .tag:hover{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1);transform:translateY(-1px)}
  .tag .tn{font-size:10.5px;color:#c4b5fd;font-weight:400}
  .tag .tc{font-size:9.5px;color:var(--ink-3);background:rgba(167,139,250,.12);padding:0 6px;border-radius:999px;font-family:var(--font-tech)}

  /* ---------- 主区 / 密集阅读器行 ---------- */
  .groups{display:flex;flex-direction:column;gap:16px}
  .day-group{}
  .day-group-h{display:flex;align-items:center;gap:9px;margin-bottom:6px;padding:5px 11px;border-radius:8px;background:rgba(10,9,18,.6);border:.5px solid var(--line);width:fit-content;cursor:pointer;user-select:none;position:sticky;top:0;z-index:5}
  .day-group-h .dt{font-family:var(--font-tech);font-weight:500;color:#c4b5fd;font-size:12px;letter-spacing:.3px}
  .day-group-h .cnt{font-size:10px;color:var(--ink-3);background:rgba(167,139,250,.1);border:.5px solid rgba(167,139,250,.2);border-radius:999px;padding:1px 8px;font-family:var(--font-tech)}
  .day-group-h .chv{margin-left:auto;color:var(--accent);font-size:11px;transition:transform .25s}
  .day-group.collapsed .chv{transform:rotate(-90deg)}
  .day-group.collapsed .rows-in{display:none}
  .rows-in{display:flex;flex-direction:column}

  .row{
    display:flex;align-items:flex-start;gap:13px;padding:13px 8px;position:relative;
    border-top:.5px solid var(--line);scroll-margin-top:70px;cursor:pointer;
    opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease,background .2s
  }
  .row:first-child{border-top:none}
  .row.in{opacity:1;transform:none}
  .row:hover{background:rgba(167,139,250,.025)}
  .row.collapsed:hover{background:rgba(167,139,250,.035)}
  .row::before{content:"";position:absolute;left:0;top:0;width:0;height:1px;background:linear-gradient(90deg,var(--accent),transparent);transition:width .3s}
  .row:hover::before{width:36px}

  .src-badge{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;border:.5px solid rgba(167,139,250,.28);background:rgba(167,139,250,.05);font-size:10.5px;font-weight:500;letter-spacing:.04em;align-self:flex-start;margin-top:2px}
  .src-badge.b-x{border-color:rgba(196,181,253,.22);background:var(--x-soft);color:var(--x)}
  .src-badge.b-research{border-color:rgba(125,211,252,.18);background:var(--research-soft);color:var(--research)}
  .src-badge.b-media{border-color:rgba(252,211,77,.18);background:var(--media-soft);color:var(--media)}
  .src-badge.b-hf{border-color:rgba(110,231,183,.18);background:var(--hf-soft);color:var(--hf)}
  .src-badge .bdot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
  .rel{font-size:10.5px;color:var(--ink-3);font-family:var(--font-tech);letter-spacing:.2px;align-self:flex-start;margin-top:3px;flex:none}

  .row-mid{flex:1;min-width:0;padding-right:96px}
  .row-mid .title{margin:0 0 6px;font-size:15.5px;line-height:1.45;font-weight:500;color:#ece8f7;letter-spacing:.01em}
  .row-mid .summary{margin:0 0 8px;font-size:13px;color:#9a95ae;font-weight:300;line-height:1.6;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .row:not(.collapsed) .row-mid .summary{-webkit-line-clamp:unset;overflow:visible}
  .card-toggle{margin:2px 0 8px;font-size:11.5px;color:var(--ink-3);user-select:none;font-family:var(--font-tech);letter-spacing:.04em;transition:color .2s}
  .card-toggle:hover{color:#c4b5fd}
  .row.collapsed .card-toggle{color:#a78bfa;font-weight:500}
  .expand-btn{background:none;border:.5px solid var(--line-2);color:#c4b5fd;font-size:11.5px;padding:5px 12px;border-radius:8px;cursor:pointer;margin-bottom:10px;transition:background .2s,border-color .2s;font-family:var(--font-tech);letter-spacing:.04em}
  .expand-btn:hover{background:var(--accent-soft);border-color:rgba(167,139,250,.4)}
  .abstract-en{background:rgba(255,255,255,.02);border:.5px solid var(--line);border-left:2px solid var(--accent);border-radius:10px;padding:11px 14px;font-size:12px;color:#8a85a0;margin-bottom:10px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre-wrap;line-height:1.6}
  .row.collapsed .expand-btn,.row.collapsed .abstract-en{display:none}

  .row-btns{position:absolute;right:8px;top:13px;display:flex;gap:7px;align-items:center}
  .rbtn{width:30px;height:28px;border-radius:8px;border:.5px solid var(--line);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.015);cursor:pointer;text-decoration:none;color:#8a85a0;transition:border-color .2s,background .2s,color .2s,transform .15s}
  .rbtn:hover{border-color:var(--line-2);color:#d4d0e0;transform:translateY(-1px)}
  .rbtn.pdf-link{border-color:rgba(167,139,250,.4);color:#c4b5fd;background:rgba(167,139,250,.04)}
  .rbtn.pdf-link:hover{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.6);box-shadow:0 0 14px rgba(167,139,250,.25)}
  .rbtn.pdf-link.pulse{animation:pdfPulse 1.8s ease-in-out 2}
  @keyframes pdfPulse{0%,100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}50%{box-shadow:0 0 0 6px rgba(167,139,250,.15)}}
  .rbtn .lbl{font-size:0;overflow:hidden}
  .pdf-link[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#161420;color:#ece8f7;font-size:11px;font-weight:400;white-space:nowrap;padding:6px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);border:.5px solid var(--line);pointer-events:none}
  .ripple{position:absolute;border-radius:50%;background:rgba(167,139,250,.4);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}
  .proxy-note{font-size:11px;color:var(--ink-3);font-style:italic}
  .proxy-note a{color:#c4b5fd;text-decoration:none;border-bottom:1px dotted rgba(196,181,253,.4)}
  .idx-wm{position:absolute;right:8px;bottom:8px;font-family:var(--font-tech);font-size:26px;font-weight:200;line-height:1;color:rgba(167,139,250,.06);pointer-events:none;user-select:none;letter-spacing:1px}

  /* ---------- 指引 ---------- */
  .hint{display:flex;align-items:flex-start;gap:10px;max-width:1100px;margin:14px auto 0;padding:12px 16px;background:rgba(255,255,255,.022);border:.5px solid var(--line);border-left:2px solid var(--accent);border-radius:12px;font-size:12.5px;color:#b8b3ce;box-shadow:var(--shadow);animation:hintIn .5s ease both}
  @keyframes hintIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .hint .ic{font-size:14px;line-height:1.4}
  .hint b{color:#c4b5fd;font-weight:500}
  .hint .x{margin-left:auto;cursor:pointer;border:none;background:none;color:#5a556a;font-size:18px;line-height:1;padding:0 2px}
  .hint .x:hover{color:#ece8f7}

  /* ---------- Toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#161420;color:#ece8f7;font-size:13px;padding:11px 18px;border-radius:12px;border:.5px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:60;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:9px;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .spin{width:14px;height:14px;border:1.5px solid rgba(255,255,255,.2);border-top-color:#c4b5fd;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 可下载 PDF 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:70;display:none}
  .modal.open{display:block}
  .modal-back{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);animation:fadeIn .25s ease}
  .modal-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(640px,92vw);max-height:84vh;display:flex;flex-direction:column;background:#12101a;border:.5px solid var(--line-2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(167,139,250,.08);overflow:hidden;animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(167,139,250,.06));color:#ece8f7;border-bottom:.5px solid var(--line)}
  .modal-head h2{margin:0;font-size:17px;font-weight:300;letter-spacing:.02em}
  .modal-head p{margin:3px 0 0;font-size:11.5px;opacity:.55;font-weight:300}
  .modal-x{border:.5px solid var(--line-2);background:rgba(255,255,255,.04);color:#d4d0e0;width:28px;height:28px;border-radius:8px;font-size:17px;line-height:1;cursor:pointer;transition:background .2s}
  .modal-x:hover{background:rgba(255,255,255,.08)}
  .modal-body{overflow-y:auto;padding:14px 18px 20px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
  .pdf-cat{margin-bottom:12px}
  .pdf-cat-h{font-size:11.5px;font-weight:500;color:#c4b5fd;margin:4px 2px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;letter-spacing:.04em}
  .pdf-cat-h:hover{color:#d8b4fe}
  .pdf-cat-h span{background:rgba(167,139,250,.1);color:#c4b5fd;font-size:10px;padding:1px 8px;border-radius:999px;font-family:var(--font-tech)}
  .pdf-cat-h .chv{margin-left:auto;font-size:11px;transition:transform .25s;color:var(--accent)}
  .pdf-cat.collapsed .chv{transform:rotate(-90deg)}
  .pdf-cat.collapsed .pdf-cat-list{display:none}
  .modal-head-actions{display:flex;align-items:center;gap:8px}
  .modal-toggle{border:.5px solid var(--line-2);background:rgba(255,255,255,.04);color:#d4d0e0;font-size:11px;padding:5px 11px;border-radius:8px;cursor:pointer;transition:background .2s;letter-spacing:.04em}
  .modal-toggle:hover{background:rgba(255,255,255,.08)}
  .pdf-cat-list{display:flex;flex-direction:column;gap:7px}
  .pdf-row{display:flex;align-items:center;gap:12px;padding:9px 11px;border:.5px solid var(--line);border-radius:9px;background:rgba(255,255,255,.015);transition:border-color .2s,background .2s}
  .pdf-row:hover{border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.04)}
  .pdf-row-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .pdf-seq{font-family:var(--font-tech);font-size:10.5px;font-weight:500;color:#c4b5fd;background:rgba(167,139,250,.08);border:.5px solid rgba(167,139,250,.2);border-radius:5px;padding:2px 6px;flex:none}
  .pdf-title{font-size:12.5px;color:#d4d0e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:300}
  .pdf-mini{flex:none;display:inline-flex;align-items:center;gap:5px;background:transparent;color:#c4b5fd;font-size:11.5px;font-weight:500;text-decoration:none;padding:6px 12px;border-radius:7px;border:.5px solid rgba(167,139,250,.4);transition:transform .18s,background .2s,border-color .2s;letter-spacing:.04em}
  .pdf-mini:hover{transform:translateY(-2px);background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.6)}
  .pdf-mini:active{transform:scale(.97)}

  footer.foot{text-align:center;color:var(--ink-3);font-size:11px;margin-top:38px;padding:0 16px 10px;font-weight:300;line-height:1.7}
  footer.foot a{color:#c4b5fd;text-decoration:none;border-bottom:1px dotted rgba(196,181,253,.4)}
  footer.foot a:hover{color:#d8b4fe}

  /* 视图密度切换 */
  body.view-cozy .row{padding:18px 8px}
  body.view-cozy .row-mid .summary{-webkit-line-clamp:2}
  body.view-cozy .row:not(.collapsed) .row-mid .summary{-webkit-line-clamp:unset}

  @media (max-width:760px){
    .archive{grid-template-columns:1fr;gap:14px}
    .side{position:static;max-height:none;flex-direction:row;overflow-x:auto}
    .snav{min-width:200px}
    .chips{gap:7px}
    .chip{min-width:72px;padding:6px 9px}
    .chip .v{font-size:20px}
    .hero-top{flex-direction:column;align-items:flex-start;gap:14px}
    .row-mid{padding-right:0}
    .row-btns{position:static;margin-top:8px}
    .idx-wm{display:none}
    .toolbar-inner{flex-wrap:wrap;gap:8px}
    .search{max-width:none;width:100%}
    .tb-r{margin-left:0;width:100%;justify-content:space-between}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.row{opacity:1;transform:none}}
</style>
</head>

        <div class="chip"><div class="k"><span class="k-bar" style="width:40px"></span></div><div class="v" id="stat-range" style="font-size:15px"></div><div class="sub">北京时间</div></div>
        <div class="chip pdf clickable" id="stat-pdf-card"><span class="go">↧ 浏览</span><div class="k"><span class="k-bar" style="width:46px"></span></div><div class="v" id="stat-pdf" data-count></div><svg class="spark" id="spark-pdf" viewBox="0 0 48 15" preserveAspectRatio="none"></svg></div>

<script>
const ARCHIVE = __ARCHIVE_JSON__;
(function(){
  const papers = ARCHIVE.papers, meta = ARCHIVE.meta;
  const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 统计
  document.getElementById('stat-range').textContent = meta.earliest + ' ~ ' + meta.latest;
  setCount('stat-total', meta.total);
  setCount('stat-pdf', meta.pdfCount);
  setCount('stat-x', meta.xCount);

  function setCount(id, n){
    const el = document.getElementById(id);
    const target = Number(n)||0;
    if(!('requestAnimationFrame' in window)){ el.textContent = target; return; }
    const dur = 900, t0 = performance.now();
    (function tick(now){
      const p = Math.min(1,(now-t0)/dur);
      const e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(target*e);
      if(p<1) requestAnimationFrame(tick); else el.textContent = target;
    })(t0);
  }

  // sparkline：最近 7 天按天聚合
  function dailyCounts(filterFn){
    const days = {};
    const today = new Date();
    for(let i=6;i>=0;i--){
      const d = new Date(today.getTime()-i*86400000);
      days[d.toISOString().slice(0,10)] = 0;
    }
    papers.forEach(p=>{
      const day = new Date(new Date(p.ts).getTime()+8*3600*1000).toISOString().slice(0,10);
      if(day in days && (!filterFn || filterFn(p))) days[day]++;
    });
    return Object.values(days);
  }
  function renderSpark(id, vals){
    const svg = document.getElementById(id); if(!svg) return;
    const max = Math.max(1, ...vals), W=48, H=15;
    const pts = vals.map((v,i)=>[ (i/(vals.length-1))*W, H - (v/max)*(H-2) - 1 ]);
    const line = pts.map((p,i)=> (i? 'L':'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const area = line + ' L'+W+','+H+' 0,'+H+'Z';
    svg.innerHTML = '<defs><linearGradient id="sg'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="sf'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>'
      + '<path d="'+area+'" fill="url(#sf'+id+')"/>'
      + '<path d="'+line+'" fill="none" stroke="url(#sg'+id+')" stroke-width="1.3" stroke-linejoin="round"/>';
  }
  renderSpark('spark-total', dailyCounts());
  renderSpark('spark-pdf', dailyCounts(p=>!!p.pdf));
  renderSpark('spark-x', dailyCounts(p=>p.srcType==='x'));

  // 相对时间
  function relTime(iso){
    const t = new Date(iso).getTime();
    const s = Math.max(1, Math.floor((Date.now()-t)/1000));
    if(s<60) return s+' 秒前';
    const m = Math.floor(s/60); if(m<60) return m+' 分前';
    const h = Math.floor(m/60); if(h<24) return h+' 时前';
    const d = Math.floor(h/24); if(d<30) return d+' 天前';
    return Math.floor(d/30)+' 月前';
  }
  function beijingDate(iso){ return new Date(new Date(iso).getTime()+8*3600*1000).toISOString().slice(0,10); }
  function beijingTime(iso){ return new Date(new Date(iso).getTime()+8*3600*1000).toISOString().slice(11,16); }
  function weekdayCn(iso){
    const w = new Date(new Date(iso).getTime()+8*3600*1000).getDay();
    return ['日','一','二','三','四','五','六'][w];
  }

  // 分组
  const groups = [], map = {};
  papers.forEach(p=>{
    const day = beijingDate(p.ts);
    if(!map[day]){ map[day]={day,list:[]}; groups.push(map[day]); }
    map[day].list.push(p);
  });
  groups.sort((a,b)=> b.day < a.day ? -1 : 1);

  // 时间轴
  const tl = document.getElementById('timeline');
  groups.forEach((g, i)=>{
    const div = document.createElement('div');
    div.className = 'tl-date' + (i>=7 ? ' dim' : '');
    div.dataset.target = 'group-'+g.day;
    div.tabIndex = 0;
    div.setAttribute('role','button');
    div.setAttribute('aria-label','跳转到 '+g.day);
    div.innerHTML = '<span class="dy">'+g.day+'</span><span class="small">'+g.list.length+'</span>';
    tl.appendChild(div);
  });

  // 卡片（密集阅读器行）
  const cards = document.getElementById('cards');
  const cardMap = {}, groupMap = {};
  let firstPdf = true;
  groups.forEach((g, gi)=>{
    const first = g.list[0];
    const section = document.createElement('section');
    section.className = 'day-group' + (gi>=7 ? ' collapsed' : '');
    section.id = 'group-'+g.day;
    section.dataset.day = g.day;
    const head = document.createElement('div');
    head.className='day-group-h';
    head.dataset.target='group-'+g.day;
    head.innerHTML = '<span class="dt">'+g.day+' · 周'+weekdayCn(first.ts)+'</span><span class="cnt">'+g.list.length+' 篇</span><span class="chv">▾</span>';
    const inner = document.createElement('div');
    inner.className='rows-in';
    section.appendChild(head);
    section.appendChild(inner);
    cards.appendChild(section);
    groupMap[g.day] = section;

    g.list.forEach((p)=>{
      const linkAttr = p.link ? ('href="'+esc(p.link)+'" target="_blank" rel="noopener"') : '';
      let html = '';
      html += '<article class="row collapsed" data-type="'+p.srcType+'"'+(p.pdf?' data-pdf="1"':' data-pdf="0"')+'>';
      html += '<span class="src-badge b-'+p.srcType+'"><span class="bdot"></span>'+esc(p.badge)+'</span>';
      html += '<span class="rel">'+relTime(p.ts)+'</span>';
      html += '<div class="row-mid">';
      html += '<h3 class="title">'+esc(p.title)+'</h3>';
      html += '<div class="card-toggle">▾ 点击展开摘要</div>';
      html += '<p class="summary">'+esc(p.summary)+'</p>';
      if(p.abstractEn){
        const aid = 'abs'+p.seq;
        html += '<button class="expand-btn" data-target="'+aid+'">展开原文摘要（英文）▾</button>';
        html += '<div class="abstract-en" id="'+aid+'" hidden>'+esc(p.abstractEn)+'</div>';
      }
      html += '</div>'; // row-mid
      html += '<div class="row-btns">';
      if(p.pdf){
        const pulse = firstPdf ? ' pulse' : '';
        firstPdf = false;
        const isLocalPdf = String(p.pdf).indexOf('pdfs/') === 0;
        const pdfAttrs = isLocalPdf ? (' download="AI论文-'+String(p.seq).padStart(3,'0')+'.pdf"') : ' target="_blank" rel="noopener"';
        html += '<a class="rbtn pdf-link'+pulse+'" data-tip="' + (isLocalPdf ? '点击直接下载 PDF 到本地' : '从 arXiv 打开 PDF（新标签）') + '" href="'+esc(p.pdf)+'"'+pdfAttrs+'aria-label="下载 PDF"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M4.5 7L8 11l3.5-4M3 13h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
        html += '<a class="rbtn" '+linkAttr+' aria-label="arXiv 原文"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M5 3h8v8M13 3L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
      }else if(p.srcType==='x'){
        html += '<a class="rbtn" href="'+esc(p.link)+'" target="_blank" rel="noopener" aria-label="查看原帖"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M5 3h8v8M13 3L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
      }else if(p.link){
        html += '<a class="rbtn" '+linkAttr+' aria-label="查看原文"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M5 3h8v8M13 3L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
      }
      html += '</div>';
      html += '<span class="idx-wm">'+String(p.seq).padStart(2,'0')+'</span>';
      html += '</article>';
      inner.insertAdjacentHTML('beforeend', html);
      cardMap[p.seq] = inner.lastElementChild;
    });
  });

  // 功能1：点击行展开/收起中文摘要
  document.querySelectorAll('.row').forEach(card=>{
    const toggle = card.querySelector('.card-toggle');
    const sync = ()=>{ if(toggle) toggle.textContent = card.classList.contains('collapsed') ? '▾ 点击展开摘要' : '▴ 点击收起'; };
    sync();
    card.addEventListener('click', (e)=>{
      if(e.target.closest('a,button')) return;
      card.classList.toggle('collapsed');
      sync();
    });
  });

  // 英文摘要
  document.querySelectorAll('.expand-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.target);
      const hidden = el.hasAttribute('hidden');
      if(hidden){ el.removeAttribute('hidden'); btn.textContent='收起原文摘要（英文）▴'; }
      else { el.setAttribute('hidden',''); btn.textContent='展开原文摘要（英文）▾'; }
    });
  });

  // 时间轴跳转
  document.querySelectorAll('.tl-date').forEach(td=>{
    const go = ()=>{
      const el = document.getElementById(td.dataset.target);
      if(el){
        el.classList.remove('collapsed');
        el.scrollIntoView({behavior:'smooth', block:'start'});
      }
    };
    td.addEventListener('click', go);
    td.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
  });

  // 日期分组折叠
  document.querySelectorAll('.day-group-h').forEach(hd=>{
    hd.addEventListener('click', ()=> hd.parentElement.classList.toggle('collapsed'));
  });

  // 指引
  const hint = document.getElementById('hint');
  if(sessionStorage.getItem('aihint_closed')) hint.style.display='none';
  document.getElementById('hintClose').addEventListener('click', ()=>{ hint.style.display='none'; sessionStorage.setItem('aihint_closed','1'); });

  // 分类标签云
  const tagcloud = document.getElementById('tagcloud');
  const CAT_ORDER = ['智能体','大语言模型','多模态/视觉','强化学习','检索/RAG','推理与训练','其他'];
  const catMap = {};
  papers.forEach(p=>{ catMap[p.cat] = (catMap[p.cat]||0)+1; });
  const cats = Object.keys(catMap).sort((a,b)=> CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
  cats.forEach(c=>{
    const t = document.createElement('div');
    t.className='tag';
    t.innerHTML = '<span class="tn">'+esc(c)+'</span><span class="tc">'+catMap[c]+'</span>';
    t.addEventListener('click', ()=>{
      searchInput.value = c; currentQuery = c.toLowerCase(); applyAll();
      groups.forEach(g=> groupMap[g.day].classList.remove('collapsed'));
    });
    tagcloud.appendChild(t);
  });

  // 筛选 + 搜索
  const fbtns = document.querySelectorAll('.fbtn');
  fbtns[0].querySelector('span').textContent = meta.total;
  fbtns[1].querySelector('span').textContent = meta.pdfCount;
  fbtns[2].querySelector('span').textContent = meta.xCount;
  let currentFilter = 'all', currentQuery = '';
  function matchSearch(p){
    if(!currentQuery) return true;
    const hay = (p.title+' '+p.summary+' '+p.badge+' '+p.cat).toLowerCase();
    return hay.includes(currentQuery);
  }
  function applyAll(){
    groups.forEach(g=>{
      let any = false;
      g.list.forEach(p=>{
        const card = cardMap[p.seq];
        let show = true;
        if(currentFilter==='pdf') show = !!p.pdf;
        else if(currentFilter==='proxy') show = p.srcType==='x';
        if(show) show = matchSearch(p);
        card.style.display = show ? '' : 'none';
        if(show) any = true;
      });
      groupMap[g.day].style.display = any ? '' : 'none';
    });
  }
  fbtns.forEach(b=> b.addEventListener('click', ()=>{
    fbtns.forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.f;
    applyAll();
  }));
  const searchInput = document.getElementById('search');
  const searchClear = document.getElementById('searchClear');
  function defaultCollapse(){
    groups.forEach((g,i)=>{ if(i>=7) groupMap[g.day].classList.add('collapsed'); else groupMap[g.day].classList.remove('collapsed'); });
  }
  searchInput.addEventListener('input', ()=>{
    currentQuery = searchInput.value.trim().toLowerCase();
    if(currentQuery) groups.forEach(g=> groupMap[g.day].classList.remove('collapsed'));
    applyAll();
  });

  // 视图密度
  const vList = document.getElementById('viewList'), vCozy = document.getElementById('viewCozy');
  vList.addEventListener('click', ()=>{ document.body.classList.remove('view-cozy'); vList.classList.add('a'); vCozy.classList.remove('a'); });
  vCozy.addEventListener('click', ()=>{ document.body.classList.add('view-cozy'); vCozy.classList.add('a'); vList.classList.remove('a'); });

  // Toast
  const toast = document.getElementById('toast'), toastMsg = document.getElementById('toastMsg');
  let toastTimer;
  function showToast(msg, ms=2200){ toastMsg.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove('show'), ms); }

  // PDF 点击
  document.querySelectorAll('.pdf-link').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const r = btn.getBoundingClientRect();
      const rip = document.createElement('span');
      const size = Math.max(r.width, r.height);
      rip.className='ripple';
      rip.style.width = rip.style.height = size+'px';
      rip.style.left = (e.clientX - r.left - size/2)+'px';
      rip.style.top  = (e.clientY - r.top  - size/2)+'px';
      btn.appendChild(rip);
      setTimeout(()=>rip.remove(), 600);
      const isLocal = String(btn.getAttribute('href')||'').indexOf('pdfs/') === 0;
      showToast(isLocal ? '已开始下载 PDF 到本地…' : '正在打开 arXiv 官方 PDF…');
      btn.classList.remove('pulse');
    });
  });

  // PDF 弹窗
  const pdfModal = document.getElementById('pdfModal');
  const pdfBody = document.getElementById('pdfModalBody');
  const pdfSub = document.getElementById('pdfModalSub');
  function openPdfModal(){
    const dl = ARCHIVE.papers.filter(p=>p.pdf);
    const gs = {};
    dl.forEach(p=>{ (gs[p.cat]=gs[p.cat]||[]).push(p); });
    const cs = Object.keys(gs).sort((a,b)=> CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
    let h = '';
    cs.forEach(c=>{
      h += '<div class="pdf-cat"><div class="pdf-cat-h">'+esc(c)+'<span>'+gs[c].length+'</span><span class="chv">▾</span></div><div class="pdf-cat-list">';
      gs[c].forEach(p=>{
        h += '<div class="pdf-row"><div class="pdf-row-main"><span class="pdf-seq">'+String(p.seq).padStart(2,'0')+'</span><span class="pdf-title" title="'+esc(p.title)+'">'+esc(p.title)+'</span></div>'
           + '<a class="pdf-mini" href="'+esc(p.pdf)+'"'+(String(p.pdf).indexOf('pdfs/')===0?(' download="AI论文-'+String(p.seq).padStart(3,'0')+'.pdf"'):' target="_blank" rel="noopener"')+'>下载 ↧</a></div>';
      });
      h += '</div></div>';
    });
    pdfBody.innerHTML = h;
    pdfSub.textContent = '共 '+dl.length+' 篇 · 按主题分类 · 均来自 arXiv 官方';
    pdfModal.classList.add('open');
    pdfModal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    pdfBody.scrollTop = 0;
    pdfBody.querySelectorAll('.pdf-cat-h').forEach(hd=> hd.addEventListener('click', ()=> hd.parentElement.classList.toggle('collapsed')));
    const toggleBtn = document.getElementById('pdfToggle');
    toggleBtn.textContent = '全部折叠';
    toggleBtn.onclick = ()=>{
      const cats = pdfBody.querySelectorAll('.pdf-cat');
      const anyOpen = [...cats].some(c=>!c.classList.contains('collapsed'));
      cats.forEach(c=> c.classList.toggle('collapsed', anyOpen));
      toggleBtn.textContent = anyOpen ? '全部展开' : '全部折叠';
    };
  }
  function closePdfModal(){ pdfModal.classList.remove('open'); pdfModal.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; }
  document.getElementById('stat-pdf-card').addEventListener('click', openPdfModal);
  document.getElementById('pdfClose').addEventListener('click', closePdfModal);
  document.getElementById('pdfBack').addEventListener('click', closePdfModal);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && pdfModal.classList.contains('open')) closePdfModal(); });
  pdfBody.addEventListener('click', e=>{ if(e.target.closest('.pdf-mini')) showToast('正在打开 arXiv 官方 PDF…'); });

  // 滚动渐入
  const io = new IntersectionObserver((entries)=>{
    entries.forEach((e,i)=>{
      if(e.isIntersecting){ e.target.style.transitionDelay = (Math.min(i,6)*40)+'ms'; e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:.08, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.row').forEach(c=>io.observe(c));
})();
</script>
</body>
</html>
