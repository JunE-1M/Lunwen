<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AI 论文档案库 · 内容直读</title>
<style>
  :root{
    --bg:#f4f8ff; --panel:#ffffff; --ink:#0f2747; --muted:#5b7290;
    --line:#dbe6f5; --accent:#2563eb; --accent-d:#1d4ed8; --accent-soft:#eaf1ff;
    --x:#7c3aed; --x-soft:#f3ecff; --research:#0ea5e9; --research-soft:#e6f6fe;
    --media:#f59e0b; --media-soft:#fff5e6; --hf:#10b981; --hf-soft:#e7faf2;
    --shadow:0 6px 24px rgba(37,99,235,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#eef4ff 0%,#f4f8ff 240px,#f4f8ff 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:48px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ---------- Header ---------- */
  header.hero{
    background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%);
    color:#fff;padding:40px 0 30px;box-shadow:0 10px 30px rgba(29,78,216,.25);
  }
  .hero .wrap{padding:0 24px}
  .hero h1{margin:0;font-size:30px;letter-spacing:.5px;font-weight:800}
  .hero .sub{margin:8px 0 0;opacity:.9;font-size:14px}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .stat{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    border-radius:14px;padding:12px 16px;min-width:140px;flex:1
  }
  .stat .k{font-size:12px;opacity:.85}
  .stat .v{font-size:24px;font-weight:800;margin-top:2px}
  .stat .sub{font-size:11px;opacity:.75;margin-top:2px}

  /* ---------- Layout ---------- */
  .archive{display:grid;grid-template-columns:160px 1fr;gap:0;margin-top:30px}
  .timeline{position:relative;padding-top:6px}
  .timeline::before{
    content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--accent),var(--line));
  }
  .tl-date{
    position:relative;margin:0 0 18px;padding-left:42px;font-weight:700;color:var(--accent-d);
    font-size:13px
  }
  .tl-date::before{
    content:"";position:absolute;left:11px;top:4px;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)
  }
  .tl-date small{display:block;font-weight:500;color:var(--muted);font-size:11px}

  .cards{display:flex;flex-direction:column;gap:18px;padding-left:8px}

  /* ---------- Card ---------- */
  .card{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease;
    overflow:hidden
  }
  .card.in{opacity:1;transform:none}
  .card:hover{box-shadow:0 10px 30px rgba(37,99,235,.14);transform:translateY(-2px)}
  .seq-wm{
    position:absolute;right:14px;top:6px;font-size:46px;font-weight:900;
    color:var(--accent-soft);line-height:1;pointer-events:none;user-select:none
  }
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .badge{
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-d);border:1px solid #cfe0ff
  }
  .badge.b-x{background:var(--x-soft);color:var(--x);border-color:#e3d4ff}
  .badge.b-research{background:var(--research-soft);color:var(--research);border-color:#c7eafb}
  .badge.b-media{background:var(--media-soft);color:#b87403;border-color:#ffe2b0}
  .badge.b-hf{background:var(--hf-soft);color:#0a8a63;border-color:#c4f0dd}
  .rel{font-size:12px;color:var(--muted)}
  .title{margin:2px 0 8px;font-size:18px;line-height:1.5;font-weight:800;color:var(--ink);padding-right:54px}
  .summary{margin:0 0 12px;font-size:14.5px;color:#243a57}
  .expand-btn{
    background:none;border:1px dashed #b9cdf0;color:var(--accent-d);
    font-size:12.5px;padding:5px 12px;border-radius:8px;cursor:pointer;margin-bottom:10px
  }
  .expand-btn:hover{background:var(--accent-soft)}
  .abstract-en{
    background:#f7faff;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:12px 14px;font-size:13px;color:#33486a;margin-bottom:12px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre-wrap
  }
  .card-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pdf-link{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    font-size:13px;font-weight:700;text-decoration:none;padding:8px 14px;border-radius:10px;
    box-shadow:0 4px 12px rgba(37,99,235,.3)
  }
  .pdf-link:hover{background:var(--accent-d)}
  .src-link{
    display:inline-flex;align-items:center;gap:5px;color:var(--accent-d);font-size:13px;
    font-weight:600;text-decoration:none;border:1px solid var(--line);
    padding:7px 12px;border-radius:10px;background:#fff
  }
  .src-link:hover{background:var(--accent-soft)}
  .src-link .arw{transition:transform .2s}
  .src-link:hover .arw{transform:translate(2px,-2px)}
  .proxy-note{font-size:12px;color:#94a3b8}
  .proxy-note a{color:#a78bda;text-decoration:none;border-bottom:1px dotted #c4b1ec}
  .proxy-note a:hover{color:var(--x)}

  footer.foot{
    text-align:center;color:var(--muted);font-size:12px;margin-top:40px;padding:0 16px 10px
  }
  footer.foot a{color:var(--accent);text-decoration:none}

  /* ---------- Responsive ---------- */
  @media (max-width:760px){
    .archive{grid-template-columns:34px 1fr;gap:0}
    .timeline::before{left:6px}
    .tl-date{padding-left:22px;font-size:12px}
    .tl-date::before{left:-1px;width:13px;height:13px}
    .tl-time{display:none}
    .cards{padding-left:4px}
    .card{padding:16px 15px}
    .title{font-size:16.5px}
    .seq-wm{font-size:38px}
    .hero h1{font-size:23px}
    .stat .v{font-size:20px}
  }
  @media (max-width:420px){
    .badge{font-size:11px;padding:2px 8px}
    .stat{min-width:calc(50% - 6px)}
  }
</style>
</head>

</header>

<main class="wrap">

rue, "summary": "Meta 新论文提出用判别式语言模型做检索，将 0.6B Qwen3 模型嵌入经典双塔架构，替代自回归生成 item ID，使向量检索保持高速。更强的交叉编码器作为教师进行知识蒸馏，移除蒸馏后 Recall@10 在 Beauty、Sports、Toys 上分别下降 13.3%、23.1%、8.0%。", "link": "https://x.com/rohanpaul_ai/status/2086709122406490501", "pdf": null, "abstractEn": null}, {"seq": 6, "title": "ベースモデルに依存しないオーケストレーションに向けて：Gemma 4版 Sakana Fuguの検証", "badge": "Sakana AI", "srcType": "x", "ts": "2026-08-09T23:42:42.467Z", "isPub": true, "summary": "（暂无摘要）", "link": "https://sakana.ai/fugu-gemma4", "pdf": null, "abstractEn": null}, {"seq": 7, "title": "AI 削减入门岗或引发\"认知公地悲剧\"", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-09T21:14:28.639Z", "isPub": true, "summary": "一篇论文提出，用 AI 削减入门级工作会造成长期专业人才断层，且没有任何单一公司有动力解决，并将其定义为\"认知公地\"问题。论文指出，AI 可直接取消初级岗位，或让初级员工不经认知挣扎就产出成果，从而削弱专业知识的再生管道。数据显示，2022 年 10 月至 2025 年 9 月，高度 AI 暴露职业中 22-25 岁工人就业相对下降 16%，而 35-49 岁就业增长超 8%。", "link": "https://x.com/rohanpaul_ai/status/2086559090109804769", "pdf": null, "abstractEn": null}, {"seq": 8, "title": "Metis：把记忆内化进 LLM 自身状态", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-09T20:14:27.701Z", "isPub": true, "summary": "Metis 提出将记忆作为 LLM 自身能力，通过骨干网络内的持久记忆状态，在前向传播中压缩过往交互，而非外挂检索系统。无上下文设置下，Metis-27B 在 LoCoMo （Gold） 得分 26.74，远超 vanilla Qwen3.5-27B 的 0.07 和 Temp-LoRA-27B 的 4.24，但仍低于全上下文 Qwen3.5-27B 的 65.03。", "link": "https://x.com/rohanpaul_ai/status/2086544779974955262", "pdf": null, "abstractEn": null}, {"seq": 9, "title": "Meta 新研究：EvoHarness-RL 让智能体自主学习工具编排策略", "badge": "X · Elvis Saravia", "srcType": "x", "ts": "2026-08-09T18:14:10.252Z", "isPub": true, "summary": "Meta 新研究提出 EvoHarness-RL，让智能体离线学习工具编排（harness）策略，并在运行时在线更新外部状态，替代手工编写。Qwen3-8B 在 ALFWorld 上达到 96.9% 准确率。训练中出现的\"工具编排退火\"与\"工具编排进化\"两种动态表明，长程任务智能体从可训练的协调策略中获益，胜过更大的工具集或记忆。", "link": "https://x.com/omarsar0/status/2086509069762981896", "pdf": null, "abstractEn": null}, {"seq": 10, "title": "Meta 研究：量化让推理模型过度自我怀疑", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-09T11:44:20.513Z", "isPub": true, "summary": "Meta 新论文发现，强量化会让推理模型在已得出正确答案后反复自我怀疑，过度思考失败率最高升至 52%。研究在数学、编程和科学任务上测试了 5 个推理模型（1.5B 至 32B），对 50 个犹豫词施加小幅惩罚即可将推理长度缩短 12% 至 23%，且常能保持或提升准确率。", "link": "https://x.com/rohanpaul_ai/status/2086415812550910146", "pdf": null, "abstractEn": null}, {"seq": 11, "title": "哈佛新研究：生成模型或存第三扩展轴", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-09T08:44:12.028Z", "isPub": true, "summary": "哈佛新论文提出生成模型可能缺失第三扩展轴：训练中的探索量。在强表征自编码器（RAE）图像生成方案中加入探索后，模型以6.2×更少的训练样本和4.1×更少的FLOPs达到基线最终性能。该方法将best-of-K训练视为扩展模型可学习模态数量的途径，而无需增加推理步骤。", "link": "https://x.com/rohanpaul_ai/status/2086370187784470962", "pdf": null, "abstractEn": null}, {"seq": 12, "title": "微软论文：编码智能体不应按聊天请求调度", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-09T07:44:08.231Z", "isPub": true, "summary": "微软对 13.5M 次 GitHub Copilot 会话的生产轨迹分析显示，87% 的 LLM 调用来自智能体自身而非用户。KV 缓存命中率在单轮内从首次调用的约 45% 升至第三次起的 92-94%，模型切换时骤降至 8%。论文提出基于轮次和会话级特征的轻量预测器，可捕获 86-90% 的总空闲时间，表明编码智能体基础设施应按轮次调度工作流状态，而非请求级策略。", "link": "https://x.com/rohanpaul_ai/status/2086356354713985266", "pdf": null, "abstractEn": null}, {"seq": 13, "title": "读者给AI生成的短篇小说打分高于人类作品，直到他们知道作者是机器", "badge": "The Decoder", "srcType": "x", "ts": "2026-08-08T14:42:27.243Z", "isPub": true, "summary": "三项实验共2500多名参与者无法区分ChatGPT与人类创作的短篇小说，且对AI文本的质量和沉浸感评分更高（质量均分1.54对0.97，沉浸感1.42对1.00）。但被告知作者是AI后，两类故事的评分均下降；对AI持正面态度的参与者评分更高，持怀疑态度者则相反。研究者认为，AI文本更流畅易读且情绪更积极，这可能解释了高评分，但未必意味着文学上更优。", "link": "https://the-decoder.com/readers-rate-ai-generated-short-stories-higher-than-human-ones-until-they-learn-a-machine-wrote-them", "pdf": null, "abstractEn": null}, {"seq": 14, "title": "DeepMind 的 WeatherNext 飓风模型为预报员争取到额外一天预警时间", "badge": "Ars Technica", "srcType": "x", "ts": "2026-08-08T11:12:34.513Z", "isPub": true, "summary": "Google DeepMind 与 Google Research 开发的 AI 模型 WeatherNext，在 2025 年 10 月飓风 Melissa 登陆前 5 天，以 80% 的置信度预测其将以 5 级飓风强度袭击牙买加。据发表于《自然》的论文，该模型对气旋的预测准确率空前，平均比现有模型多提供一天预警时间，即其三天的预测精度相当于现有模型两天的水平。", "link": "https://arstechnica.com/science/2026/08/deepminds-hurricane-model-bought-forecasters-an-extra-day", "pdf": null, "abstractEn": null}, {"seq": 15, "title": "AI 智能体 KISS Sorcar 8 小时优化 SQLite 提速 59%", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-08T10:42:22.682Z", "isPub": true, "summary": "AI 智能体 KISS Sorcar 在不到 8 小时、API 成本低于 $150 的情况下，将 SQLite 优化提速 59%（几何平均 1.59x），且全部 1，032，940 项测试通过。", "link": "https://x.com/rohanpaul_ai/status/2086038118608801981", "pdf": null, "abstractEn": null}, {"seq": 16, "title": "新 AI 模型 IceBoost v2.0 估算全球冰川蕴冰约 15 万立方千米，融化可抬升海平面 32.3 厘米", "badge": "IT之家", "srcType": "media", "ts": "2026-08-08T00:11:01.752Z", "isPub": true, "summary": "科学家构建 AI 模型 IceBoost v2.0，估算全球冰川约含 15 万立方千米冰，若全部融化（不含南极和格陵兰）将抬升全球平均海平面 32.3 厘米。该模型由威尼斯大学牵头开发，用超 700 万条冰厚测量数据及 26 个物理与几何变量训练，对冰川空间分布的描绘与实地观测匹配度最高提升 40%。研究将支撑 IPCC 冰川评估及淡水供应预测。", "link": "https://www.ithome.com/0/987/225.htm", "pdf": null, "abstractEn": null}, {"seq": 17, "title": "Arbitrage：利用优势感知投机实现高效推理", "badge": "Apple ML Research", "srcType": "research", "ts": "2026-08-07T22:53:32.619Z", "isPub": true, "summary": "现代大语言模型通过长思维链实现强大推理能力，但推理计算成本高昂。投机解码（Speculative Decoding）用快速但不精确的草稿模型提议 token，再由更强的目标模型并行验证，以加速推理。然而，语义等价步骤中的 token 不匹配会导致不必要的拒绝，传统 token 级投机解码因此受限。", "link": "https://machinelearning.apple.com/research/arbitrage-efficient-reasoning", "pdf": null, "abstractEn": null}, {"seq": 18, "title": "超越下一个 token 预测：扩散语言模型与自回归语言模型的性能对比研究", "badge": "Apple ML Research", "srcType": "research", "ts": "2026-08-07T22:53:32.619Z", "isPub": true, "summary": "苹果机器学习研究团队系统对比了扩散语言模型（DLMs）与自回归语言模型（ARMs）的性能表现。ARMs 虽在多项 NLP 任务上精度领先，但因逐 token 生成的顺序依赖导致算术强度较低。DLMs 作为新兴范式展现出潜力，研究对其性能特征进行了详细刻画。", "link": "https://machinelearning.apple.com/research/diffusion-autoregressive-performance", "pdf": null, "abstractEn": null}, {"seq": 19, "title": "KVAE：面向多模态生成模型的 tokenizer 系列", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T18:55:55.738Z", "isPub": true, "summary": "KVAE 系列 tokenizer 覆盖音频、图像与视频，专为后续文本条件生成设计。其中 KVAE-Audio 为连续全频带 48 kHz tokenizer，具备 50 Hz 潜空间与 64 通道；KVAE-3D 提供 4x16x16 与 4x8x8 两种因果视频压缩方案；KVAE-2D 图像模型实现 8 倍压缩与 32 通道。", "link": "https://arxiv.org/abs/2608.05798", "pdf": "https://arxiv.org/pdf/2608.05798v1", "abstractEn": "Latent diffusion modeling (LDM), a prominent paradigm, utilizes tokenizers to map input signal to compressed representation. This dependency positions tokenizer as an integral part of generation process itself, since it affects learning speed, quality of synthesized samples and lay foundation for later applications. This report presents series of KVAE tokenizers for audio, image and video, all designed for subsequent text-conditioned generation: KVAE-Audio, a continuous full-band 48 kHz tokenizer with a 50 Hz latent of 64 channels; KVAE-3D -- two causal video tokenizers for 4x16x16 and 4x8x8 compression; KVAE-2D, an image model, compressing input by factor of 8 with 32 channels. We demonstrate that reconstruction (PSNR, LPIPS, PESQ, etc.) and generation results on objective (Frechet Distance, CLIP score, CLAP score, etc.) and subjective (side-by-side evaluation) metrics matches or surpasses frontier opensource tokenizers, such as VAEs from Wan-2.2, HunyuanVideo-1.5, FLUX.2, MovieGen, StableAudio and MMAudio. Considering difficulty of development, we share with community training details, model selection method and ablation on design choices. The code is publicly available at https://github.com/kandinskylab/kvae and https://github.com/kandinskylab/kvae-audio."}, {"seq": 20, "title": "Activity Frames：将屏幕活动确定性编译为智能体记忆", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T17:55:55.574Z", "isPub": true, "summary": "一项研究提出 Activity Frames，用确定性、零模型管线将被动捕获的屏幕活动编译为智能体记忆，输出字节一致、可缓存且可审计。在单人 128，756 帧、51 个活跃天的语料上，该编译器将一天原始捕获压缩为 86 倍更小的提示块，耗时 68 毫秒；智能体阅读该块的问答准确率达 98.4%，优于 LLM 摘要的 66-80%。", "link": "https://arxiv.org/abs/2608.05784", "pdf": "https://arxiv.org/pdf/2608.05784v1", "abstractEn": "Computer-use agents pay full frontier inference to re-derive routines their user has already performed, because an agent's memory today records what the user said, not what the user did. We compile passively captured screen activity into agent memory with a deterministic, zero-model pipeline: it segments a local capture stream into typed activity frames, bounded episodes carrying application, site, timing, input volume, and evidence pointers back to the raw rows, with no model in the loop, so the output is byte-identical, cacheable, and mechanically auditable. On one professional's single-user corpus of 128,756 frames over 51 active days, the compiler reduces a day of raw capture to a prompt-ready context block 86x smaller in 68 ms, and an agent reading that block answers questions about the day at 98.4% accuracy (Wilson 95% CI 91.7-99.7%) against an independent oracle, versus 66-80% for an LLM summary of the same capture, a mid-tier model reading the block matching a frontier one. The same compiler doubles as a demand-side cost instrument. Read off passive, pre-delegation human activity rather than agent rollouts, it supplies two parameters that agent-cost models assume but, to our knowledge, have not measured: the Routine Overhead Ratio R and the routine recurrence h. We report first values of R, a modeled upper bound, at 60-343x, and a delegable recurrence of 9.0% in-sample and 7.7% out-of-sample, for a realistic all-fleet token ceiling near 8%; a compiled routine replays deterministically with the model out of the loop, demonstrated live at zero model tokens on a guard-matched hit. Schema, compiler, and evaluation harness are open."}, {"seq": 21, "title": "扩展分类流映射（Categorical Flow Maps）规模", "badge": "Apple ML Research", "srcType": "research", "ts": "2026-08-07T15:53:31.766Z", "isPub": true, "summary": "连续扩散与流匹配模型有望成为语言建模中自回归方法的有力替代，可解锁加速采样与倾斜等连续模态优势。近期研究通过高斯分布与one-hot编码数据分布间的简单流匹配过程，实现离散数据的连续生成，并借助分类流映射（CFMs）验证了加速采样的可行性，样本质量具有竞争力。", "link": "https://machinelearning.apple.com/research/scaling-categorical-flow-maps", "pdf": null, "abstractEn": null}, {"seq": 22, "title": "线性注意力模型实现零训练推理偏差", "badge": "X · Nathan Lambert", "srcType": "x", "ts": "2026-08-07T14:11:58.553Z", "isPub": true, "summary": "研究团队在TorchTitan RL + vLLM上为Gated DeltaNet（Qwen3.5-9B/35B-A3B）实现训练/生成逐位一致，logprob差为0，为开源首个线性注意力模型达成此目标。异步RL下，offpolicy=32时标准栈偏差超0.065，新方法保持约0.035。代价是训练吞吐量降低2-3倍，团队建议将其作为调试工具而非生产默认。", "link": "https://x.com/natolambert/status/2085726242314346760", "pdf": null, "abstractEn": null}, {"seq": 23, "title": "斯坦福与 Arc Institute 用 AI 设计全新病毒基因组，16 种在实验室成功杀死细菌", "badge": "The Decoder", "srcType": "x", "ts": "2026-08-07T13:12:02.670Z", "isPub": true, "summary": "斯坦福大学与 Arc Institute 团队用 AI 模型 Evo 从零设计完整病毒基因组，并在实验室构建出 16 种自然界不存在的功能性病毒。Evo 提出 70 万个候选基因组，团队仅筛选最有希望的 285 个序列合成并植入细菌，其中 16 个成功复制并杀死宿主。该研究已通过同行评审发表于《Science》，但 Evo 未接受人类病原体数据训练，且能否推广至其他病毒类群仍是未知数。", "link": "https://the-decoder.com/stanford-and-arc-institute-scientists-used-ai-to-design-new-viruses-that-killed-bacteria-in-the-lab", "pdf": null, "abstractEn": null}, {"seq": 24, "title": "MameLoshnLM：首个开源意第绪语 8B 语言模型与评测基准", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T10:55:52.391Z", "isPub": true, "summary": "MameLoshnLM 是首个专为意第绪语构建的开源 8B 参数语言模型，基于 Llama 3.1 8B 继续预训练而来。研究同时推出 Oytser 高质量意第绪语预训练语料库和 Kashes 多任务评测基准。在基准任务上，MameLoshnLM 优于同规模开源基线，且更好地捕捉了意第绪语特有的词汇与形态模式。", "link": "https://arxiv.org/abs/2608.05850", "pdf": "https://arxiv.org/pdf/2608.05850v1", "abstractEn": "We present MameLoshnLM, the first open-source 8B-parameter language model built specifically for Yiddish. Despite Yiddish's rich textual tradition, its limited digital presence and the scarcity of reliable evaluation resources have constrained progress in Yiddish language modeling. Existing multilingual corpora and benchmarks are often poor proxies for the language, containing substantial amounts of noisy, machine-translated, and misclassified text. We address these gaps by introducing Oytser, a high-quality Yiddish pretraining corpus that combines contemporary web-native sources with literary materials, and Kashes, a multi-task benchmark spanning translation, linguistic analysis, information extraction, and language understanding. Using these resources, we continue pretraining Llama 3.1 8B to obtain MameLoshnLM. Across the tasks in the benchmark, MameLoshnLM outperforms open baselines of similar scale. Our analyses show that these gains are not only quantitative: relative to general-purpose multilingual models, MameLoshnLM better captures language-defining lexical and morphological patterns, pointing to a broader failure mode of noisy web-scale multilingual data for low-resource languages. Our results provide both a foundation for Yiddish NLP and a practical template for language model development in historically rich but digitally underrepresented languages."}, {"seq": 25, "title": "小红书联合浙大、复旦提出 CULTURE-MT：首个面向社媒翻译的「文化有效性」评测基准，入选 ICML 2026", "badge": "小红书技术", "srcType": "x", "ts": "2026-08-07T10:00:44.054Z", "isPub": true, "summary": "小红书联合浙江大学、复旦大学提出 CULTURE-MT，这是首个面向中英社媒笔记翻译、兼顾文化符号传递与情感共鸣的评测基准，并首次提出「文化有效性」评估标准与自动评估模型 JUDGER（准确率 86.03%）。", "link": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496008&idx=1&sn=08f2ce717483f63bc00a2181e59e3f40", "pdf": null, "abstractEn": null}, {"seq": 26, "title": "TCFM：面向多语言文本嵌入平衡适配的任务条件流匹配", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T09:55:51.819Z", "isPub": true, "summary": "研究者提出任务条件流匹配（TCFM）框架，针对不同任务采用差异化训练目标：翻译任务使用流匹配，检索、分类等任务则用更契合其学习动态的目标，并结合教师引导与三阶段课程实现稳定适配。在 Indic Massive Text Embedding Benchmark 上，TCFM 取得新 SOTA，并泛化至不同嵌入模型家族，代码与数据集将在论文接收后公开。", "link": "https://arxiv.org/abs/2608.05785", "pdf": "https://arxiv.org/pdf/2608.05785v1", "abstractEn": "Multilingual text embedding models are commonly adapted using a single training objective across diverse tasks, despite different tasks requiring fundamentally different optimization strategies. We introduce Task-Conditional Flow Matching (TCFM), a multilingual embedding adaptation framework that selectively applies Flow Matching to translation tasks while optimizing retrieval, classification, and pair-classification tasks with objectives better aligned to their learning dynamics. TCFM further combines teacher-guided representation preservation with a three-stage curriculum to enable stable adaptation. Evaluated on the Indic Massive Text Embedding Benchmark, TCFM establishes a new state-of-the-art, consistently improving embedding quality across a diverse set of multilingual tasks and generalizing across embedding model families. We will publicly release the codebase and datasets upon acceptance of the paper."}, {"seq": 27, "title": "持续学习的范式转变：从参数中心到系统级适应", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T09:55:51.819Z", "isPub": true, "summary": "持续学习正从参数中心机制转向系统级适应，涵盖训练策略、架构设计及权重适配之外的更广范畴。该综述提出When、How、Where三维框架：How涵盖off-policy、on-policy与超越梯度的优化，When覆盖预训练至推理阶段，Where区分内部参数与外部结构约束，并系统梳理了代表性方法及未来挑战。", "link": "https://arxiv.org/abs/2608.06216", "pdf": "https://arxiv.org/pdf/2608.06216v1", "abstractEn": "Classical continual learning (CL) has primarily focused on enabling models to update and retain knowledge through parameter-centric mechanisms, e.g., training strategies, architectural designs, and weight adaptation. However, emerging paradigms are reshaping the scope of CL beyond this traditional model adaptation view. For instance, on-policy learning broadens the space of update mechanisms; test-time training extends CL from the training phase to inference; and external harness components such as memory, skill libraries, and interaction protocols extend the evolutionary boundaries of model capabilities far beyond the static parameter space. Collectively, these developments indicate a transition from parameter-centric learning toward system-level adaptation. To characterize this transition, we examine the evolution of continual learning through three dimensions: When, How, and Where learning occurs. The How dimension encompasses off-policy, on-policy, and beyond-gradient optimization mechanics. The When dimension captures evolution across pre-training, post-training, and inference-time stages. The Where dimension delineates updates occurring within internal parameters versus external structural constraints. Anchored by this tri-axial framework, we systematically survey representative methods, trace the ongoing transition of continual learning, and discuss the key challenges, broader implications, and future directions arising from this paradigm shift."}, {"seq": 28, "title": "MASS：用权威共享状态构建多人游戏世界模型", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T07:55:49.979Z", "isPub": true, "summary": "MASS将世界动态与视角渲染解耦，以应对多人环境中现有视频世界模型的计算冗余、视角不一致和扩展性差等问题。其学习型逻辑引擎无需手写转移函数即可推进全局权威类型化状态，渲染引擎则按需为任意相机生成独立且一致的视角。在多人Snake基准上，MASS实现了更高的状态精度和更低的跨视角不一致性，并支持1，024个并发玩家、10，000步循环预测。", "link": "https://arxiv.org/abs/2608.06257", "pdf": "https://arxiv.org/pdf/2608.06257v1", "abstractEn": "Current video world models struggle in multiplayer environments because they entangle world state with view-dependent visual latents, leading to redundant compute, view inconsistencies, and poor scalability. We propose MAS (Multiplayer world models with Authoritative Shared State) to resolve this limitation. Inspired by multiplayer game architectures, MAS disentangles world dynamics and view rendering. A learned Logic Engine advances a global, authoritative typed state from joint actions without any hand-written transition function, acting as the sole recurrent memory and synchronization reference. From this shared state, a learned Rendering Engine generates independent and consistent views for any requested camera on demand. This explicit disentangling allows MAS to achieve superior state accuracy and lower cross-view inconsistency compared to state-of-the-art multi-view baselines on a matched multiplayer Snake benchmark. It advances predicted worlds with 1,024 concurrent players for 10,000 recurrent steps. Our results show that explicit, authoritative state modeling provides a practical foundation for scalable and consistent multi-agent world simulation."}, {"seq": 29, "title": "从经济智能体到智能体经济：经济世界模型的系统蓝图", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T07:55:49.979Z", "isPub": true, "summary": "论文提出经济世界模型（EWM）实施路线图，将其组织为六级能力阶梯，从固定规则智能体世界延伸至与真实观测对齐的仿真-现实经济孪生。系统文献综述显示，现有工作集中于低层级智能体与模拟环境，具备自进化智能体、内生制度与实证对齐的系统仍属罕见。作者发布精选论文列表及相关资源，以加速下一代经济模拟环境开发。", "link": "https://arxiv.org/abs/2608.06020", "pdf": "https://arxiv.org/pdf/2608.06020v1", "abstractEn": "Economic World Models (EWMs) are generative economic models that simulate how economies evolve from within by modeling heterogeneous agents, their beliefs and actions, and the market and institutional mechanisms through which their interactions produce aggregate outcomes. This paper develops an implementation roadmap for building economic world models as generative engines in which heterogeneous agents act, interact, adapt, and co-evolve with markets and institutions, thereby producing economic dynamics from the inside. We organize EWM systems into a six-level capability ladder, from fixed rule-based agent worlds to adaptive and LLM-based agent worlds, self-evolving agents, evolving institutional worlds, and sim-to-real economic twins aligned with real observations. A systematic literature survey across these levels reveals that existing work remains concentrated in lower-level agent and simulation environments, while systems with self-evolving agents, endogenous institutions, persistent empirical alignment, and validated economic mechanisms remain rare. By translating the EWM agenda into an implementation blueprint, this paper aims to accelerate the development of the next generation of economic simulation environments that can serve as high-fidelity sandboxes for human decision-makers and as training, planning, evaluation, and safety substrates for AI agents. We release a curated paper list and related resources to support future research."}, {"seq": 30, "title": "EffectLearner：面向真实世界视频物体移除的物体-效果推理框架", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T06:55:49.495Z", "isPub": true, "summary": "EffectLearner 提出一种语义推理增强的视频物体移除框架，结合基于 VLM 的 Object-Effect Reasoner 与基于 DiT 的 Video Eraser，通过结构化效果分析提示词提取效果感知上下文，并引入运动感知掩码引导与运动一致性监督。", "link": "https://arxiv.org/abs/2608.05565", "pdf": "https://arxiv.org/pdf/2608.05565v1", "abstractEn": "Video object removal must eliminate not only the target object but also its induced effects while maintaining high-fidelity and spatiotemporally coherent restoration. Existing methods mainly learn object-effect correspondences implicitly from predefined effect categories and fixed data distributions, limiting their generalization to complex real-world scenes involving compositional effects, spatially detached or weakly correlated effects, long-tail physical phenomena, and dynamically evolving interactions. We propose EffectLearner, a semantic-reasoning-enhanced framework that combines a VLM-based Object-Effect Reasoner with a DiT-based Video Eraser. Guided by a structured effect-analysis prompt, the Reasoner performs cross-modal reasoning over a target-highlighted video and extracts compact effect-aware context, which guides the Video Eraser toward comprehensive object-effect removal. Motion-aware mask guidance and motion-consistency supervision further improve removal coverage and spatiotemporal stability under object motion and evolving scene dynamics. To fully exploit the framework in challenging real-world scenarios, we further construct EffectWorld, a paired video dataset specifically designed for complex object-induced effects, and introduce a progressive training curriculum that combines common supervision with complex-effect data. On the standard ROSE-Bench, EffectLearner outperforms existing baselines on most metrics and achieves clear advantages on both EffectWorld-Eval and the challenging EffectWorld-Wild, demonstrating its ability to deliver high-quality video object removal in complex real-world scenes."}, {"seq": 31, "title": "PaDoc：面向文档解析的布局引导并行解码", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T05:55:49.199Z", "isPub": true, "summary": "PaDoc 将预测布局视为共享页面表示上的分支结构，使布局流与区域内容分支并行推进，将解码深度降至最长布局-内容路径。在 OmniDocBench Full 上，PaDoc 取得 Overall 布局 F1 91.1，端到端解析器中 Overall 得分 94.24，Text Edit 0.038，Formula CDM 95.59。", "link": "https://arxiv.org/abs/2608.06146", "pdf": "https://arxiv.org/pdf/2608.06146v1", "abstractEn": "End-to-end document parsers provide a unified interface, but serialize page layouts and regional contents into one autoregressive sequence. This formulation forces independent regions onto a decoding path whose length grows with the total content, whereas crop-based two-stage parsers expose region-level parallelism at the cost of repeated visual prefills and fragmented page context. To retain full-page context while removing dependencies, we propose PaDoc, a layout-grounded parser that treats the predicted layout as a branching structure over a shared page representation. Under a region-sufficiency assumption, we derive a prefix-conditioned factorization in which the layout stream and regional content branches advance concurrently, reducing the decoding depth to the longest layout-content path. We realize this factorization within a single MLLM: packed variable-length ancestor attention preserves the visibility under standard next-token training, while masked parallel decoding creates branches that the evaluated vLLM backend serves as concurrent requests with cache-resident shared-prefix reuse. On OmniDocBench Full, PaDoc attains an Overall layout F1 of 91.1 and, among end-to-end parsers, a top-tier Overall score of 94.24 together with the best Text Edit (0.038) and Formula CDM (95.59). On a 384-page subset and one A800 GPU, it is the fastest end-to-end parser at five concurrency levels, improving valid-page throughput by 67.4-118% and reducing P95 latency by 39.2-54.9% relative to a same-backbone Sequential SFT baseline. Code is available at https://github.com/Longin-Yu/Padoc"}, {"seq": 32, "title": "Qwen-CUA：用屏幕鼠标键盘训练通用电脑智能体", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-07T04:11:50.284Z", "isPub": true, "summary": "Qwen-CUA 证明仅凭人类使用的屏幕、鼠标和键盘即可训练出强大的电脑智能体，将截图作为 AI 的通用界面。训练动用近 10 万虚拟处理器核心和约 4 万个可检查任务，智能体仅通过截图和鼠标键盘操作，无需网站代码或辅助标签。其在 OSWorld-Verified 基准上得分 86.2，但长时程任务仍存在较大差距。", "link": "https://x.com/rohanpaul_ai/status/2085578932368109935", "pdf": null, "abstractEn": null}, {"seq": 33, "title": "本源量子与中科大团队破解超导量子计算\"速度与保真度\"矛盾", "badge": "IT之家", "srcType": "media", "ts": "2026-08-07T04:10:50.506Z", "isPub": true, "summary": "本源量子与中国科学技术大学联合团队提出\"参数空间扩展受控相位门（PSE-CZ）\"方案，破解超导量子计算速度与保真度相互制约难题，成果发表于《物理评论快报》。在\"本源悟空\"上对20对两比特量子门测试显示，30-40纳秒极短门长下仍保持优于传统CZ门的稳定性能。该方案还可推广至离子阱、固态自旋等平台。", "link": "https://www.ithome.com/0/986/894.htm", "pdf": null, "abstractEn": null}, {"seq": 34, "title": "EnvACE：通过世界预演内化环境动态的智能体强化学习方法", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T03:55:47.262Z", "isPub": true, "summary": "EnvACE 提出一种智能体强化学习方法，用世界预演替代训练中的外部环境交互：策略先生成工具调用，再扮演环境生成响应，并基于预演结果继续决策，两端通过任务成功奖励端到端联合优化。", "link": "https://arxiv.org/abs/2608.06197", "pdf": "https://arxiv.org/pdf/2608.06197v1", "abstractEn": "Training large language model agents for long-horizon tool use typically relies on interactions with real or synthesized executable environments, whose construction and verification are costly, or on external simulators that are difficult to ground. We introduce EnvACE, an agentic reinforcement learning method that replaces external environment interaction during training with world rehearsal. The policy alternates between acting and rehearsal: it first generates a tool call, then plays the role of the environment to produce the response induced by that action, and conditions subsequent decisions on the rehearsed response. Both roles are jointly optimized end-to-end using task-success rewards. Through world rehearsal, the policy internalizes the relationship between actions and their environment responses in its parameters, yielding an agent world model that directly supports decision making. Across BFCL-v4, tau^2-Bench, VitaBench, and FinMCP-Bench, EnvACE achieves strong and transferable performance, outperforming environment-scaling baselines in the overall evaluation. Controlled studies further show that world rehearsal consistently improves policy learning across model scales. At test time, the internalized world model enables private rehearsal before committed execution, yielding further gains under a moderate rehearsal budget without additional external interaction. Our findings establish world rehearsal as a new path toward scaling LLM agent training beyond the constraints of external environments. Our code is publicly available at https://github.com/Within-yao/EnvACE."}, {"seq": 35, "title": "英伟达新论文：LLM 间可复用提示词缓存", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-07T03:11:49.459Z", "isPub": true, "summary": "英伟达新论文提出，一个 LLM 可通过简单的线性转换器复用另一模型的提示词缓存，无需重新处理整个提示词。该方法从 500 条校准序列学习，无需反向传播，在 Qwen3、Llama 3.1 和 Ministral 3 的 6 组模型对上，4 组保留了目标模型 73% 至 98% 的基准准确率，转换速度提升 2.7 至 25 倍。", "link": "https://x.com/rohanpaul_ai/status/2085558547987697969", "pdf": null, "abstractEn": null}, {"seq": 36, "title": "DyPES-VLA：学习共享动力学先验与具身特定控制，实现跨具身操作", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "DyPES-VLA 提出一种跨具身视觉-语言-动作模型，通过未来预测目标训练 VLM 学习共享动力学先验，并利用具身特定的 MoE 动作头直接在原生动作空间生成控制，无需手动对齐异构动作。作为通用策略，它在 LIBERO 上达到 98.0% 成功率，在 RoboCasa-GR1 上为 59.25%，在 RoboTwin 2.0 上为 89.02%，在仿真和真实世界评估中均取得 SOTA 性能。", "link": "https://arxiv.org/abs/2608.06374", "pdf": "https://arxiv.org/pdf/2608.06374v1", "abstractEn": "Vision-Language-Action (VLA) models have become a powerful paradigm for robot manipulation, but training a single generalist policy for heterogeneous robot embodiments remains an open problem. Existing methods have two main limitations. First, they underuse dynamics priors shared across diverse visual and interaction data, limiting cross-embodiment transfer. Second, they require extensive manual preprocessing to convert embodiment-specific actions into a common format. To overcome these limitations, we propose DyPES-VLA, a cross-embodiment VLA that learns shared Dynamics Priors and Embodiment-Specific control. First, we learn shared dynamics priors by training the vision-language model (VLM) with a future-prediction objective on cross-embodiment data, driving the shared query representation to capture object motion, contact, and interaction-induced scene changes. Second, an embodiment-specific Mixture-of-Experts (MoE) action head translates these shared dynamics priors into executable controls directly in each embodiment's native action space, without manually pre-aligning heterogeneous actions into a common format. This head shares attention layers to capture common temporal action structures, while its embodiment-specific feed-forward experts resolve the unique kinematic constraints and control semantics of distinct embodiments. As a generalist policy, our \\ourmethod achieves state-of-the-art performance across simulation and real-world evaluations, reaching 98.0% success on LIBERO, 59.25% on RoboCasa-GR1, and 89.02% on RoboTwin~2.0."}, {"seq": 37, "title": "HarnessOpt-Bench：评估大语言模型的 Harness 优化能力", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "HarnessOpt-Bench 发布，用于在昂贵且随机的评估条件下衡量前沿 LLM 的端到端编排优化能力。优化器需在固定评估预算内编辑目标智能体的 harness 并提名最终候选，最终得分基于在不可访问的测试集上相对 seed 的归一化增益。", "link": "https://arxiv.org/abs/2608.06301", "pdf": "https://arxiv.org/pdf/2608.06301v1", "abstractEn": "As LLMs are increasingly deployed within agentic systems, their capabilities depend not only on the model weights but also on the harness: the prompts, tools, control flow, memory, and orchestration code surrounding them. This makes automated harness optimization -- the iterative and evaluation-guided improvement of a harness by an AI system -- both an important route to improving AI systems and a demanding capability for AI systems themselves. Yet the community lacks a common protocol for measuring how well frontier LLMs perform at this task. We introduce HarnessOpt-Bench, a benchmark for end-to-end harness optimization under expensive and stochastic evaluation. An optimizer, an LLM paired with a coding harness, receives a target agent's seed harness, graded evaluation feedback, and a fixed target-evaluation budget. It edits the harness and nominates a final candidate, which is scored by its normalized gain over the seed on a held-out test partition that remains inaccessible throughout search. A trusted execution environment enforces the evaluation boundary, meters target-agent resource use, and preserves candidate versions for audit. We evaluate 5 frontier LLMs as optimizers both under a shared coding harness and under their native harnesses across 4 downstream tasks, over 111 scored runs. Experiment results show that optimizer models separate more than the coding harnesses they act through, native harnesses are not consistently superior, and gains vary substantially across tasks and seed regimes. These results establish harness optimization as a measurable and discriminative capability with large space for improvement."}, {"seq": 38, "title": "ChronoVision：通过潜在状态重建实现时序推理", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "ChronoVision 提出多模态框架，通过监督微调中的 Reconstructive Visual Head 预测最终变换状态的潜在表征，并借助 ROI Attention Locating 模块聚焦关键视觉证据，后训练阶段采用带隐式过程对齐的强化学习。在 Vbvr-VQA 上取得 74.8% 域内和 71.6% 域外准确率，在 IntPhys2 上达到 55.0%。", "link": "https://arxiv.org/abs/2608.05631", "pdf": "https://arxiv.org/pdf/2608.05631v1", "abstractEn": "Multimodal large language models excel at passive perception but struggle with complex visual cognitive tasks requiring multi-step temporal reasoning. This degradation largely stems from the inherent ambiguity of language-based reasoning, which often fails to accurately articulate continuous visual transformations. To address this, we propose ChronoVision, a multimodal framework designed to align visual logic with latent imagery. During supervised fine-tuning, a Reconstructive Visual Head predicts the latent representation of the final transformed state, while an ROI Attention Locating module focuses the model on key visual evidence via semantic span queries. In post-training, we apply reinforcement learning with an implicit process grounding mechanism, guided by a composite reward function that evaluates outcome correctness, latent process alignment, and unsupervised visual focus. Furthermore, we introduce Vbvr-VQA, a novel dataset that evaluates temporal tracking by reformulating video reasoning into a strict image-ordering task. Experiments demonstrate that ChronoVision achieves state-of-the-art performance on Vbvr-VQA with 74.8% in-domain and 71.6% out-of-domain accuracy, alongside a strong 55.0% accuracy on IntPhys2, a highly challenging cross-domain benchmark."}, {"seq": 39, "title": "UniME-R1：基于失败学习的检索中心思维链统一多模态检索", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "UniME-R1 提出一种 embedder-adviser 框架，通过挖掘硬负样本模拟检索失败，让 adviser 基于初始检索结果生成检索中心思维链（RC-CoT），以纠正嵌入器对细微判别线索的混淆。若目标出现在初始 top-k 集合中则直接重排，否则生成 RC-CoT 调整检索方向并执行全库重检索。在 MMEB-V2 及多个通用多模态检索基准上，UniME-R1 持续优于强基线。", "link": "https://arxiv.org/abs/2608.06060", "pdf": "https://arxiv.org/pdf/2608.06060v1", "abstractEn": "Unified multimodal retrieval aims to identify candidates that satisfy complex user intent expressed through heterogeneous inputs. Although Large Vision-Language Model (LVLM)-based retrievers are efficient and scalable, directly encoding raw multimodal inputs often misses fine-grained discriminative cues, leading to confusion among semantically similar candidates. Recent methods mitigate this limitation by generating Chain-of-Thought (CoT) rationales to enrich the query representation. However, such reasoning is typically derived from the query alone: it explains what the query describes, but not what the retriever misunderstands. We argue that effective retrieval reasoning should instead be conditioned on retrieval feedback. Based on this insight, we introduce UniME-R1, an embedder-adviser framework that learns to reason over initially retrieved candidates and generate Retrieval-Centric Chain-of-Thought (RC-CoT). The adviser analyzes candidates individually to identify the discriminative cues confused by the embedder. If the target appears in the initial top-k set, UniME-R1 directly reranks the candidates; otherwise, it generates RC-CoT to refine the retrieval direction and performs full-corpus re-retrieval with a dual-mode embedder. To train the framework, we mine hard negatives to simulate realistic retrieval failures, jointly optimize direct retrieval and RC-CoT-augmented retrieval, and align the adviser with retrieval outcomes through supervised learning and retrieval-oriented reinforcement learning. Extensive experiments on MMEB-V2 and a diverse set of general multimodal retrieval benchmarks demonstrate that UniME-R1 consistently improves retrieval performance over strong baselines."}, {"seq": 40, "title": "多语言数学推理中的 On-Policy Delta Distillation（OPD2）研究", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "一项针对 Qwen3 的研究发现，On-Policy Delta Distillation（OPD2）在多语言数学推理中持续优于原始 OPD，尤其在韩语和日语上提升显著，并普遍缩小了英语与韩语的性能差距。研究还显示，仅用英语数据的 OPD 虽能提升韩语和日语表现，但常使回答偏向英语，凸显了多语言数据对保持目标语言回答的重要性。", "link": "https://arxiv.org/abs/2608.05802", "pdf": "https://arxiv.org/pdf/2608.05802v1", "abstractEn": "On-Policy Distillation (OPD) is emerging as a promising alternative to reinforcement learning for LLM post-training, yet its effectiveness in multilingual settings remains underexplored. We study OPD and its advanced variant, On-Policy Delta Distillation (OPD$^2$), for mathematical reasoning in English, Korean, and Japanese. OPD$^2$ improves OPD by using the probability gap between a post-trained teacher and its base model as the learning signal. Experiments with Qwen3 show that OPD$^2$ consistently outperforms the original OPD, with particularly strong improvements in Korean and Japanese, and generally narrows the English-Korean performance gap. We further find that English-only OPD can also increase performance for Korean and Japanese, but often shifts the responses toward English, highlighting the importance of multilingual data to preserving target-language responses."}, {"seq": 41, "title": "GST-Bench：视频理解中的全局空间智能基准", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "GST-Bench 提出用于视频理解全局空间智能的 VQA 基准，含 6，790 分钟合成视频生成的 2，762 个人工验证问题，要求模型从新视角推理并映射到全局俯视图。对 22 个 SOTA VLM 的评估显示，最强零样本模型 Gemini-3-Pro 仅得 42.68 分，远低于人类基线 79.08；研究还提供 GST-Train 数据集以促进后续研究。", "link": "https://arxiv.org/abs/2608.05747", "pdf": "https://arxiv.org/pdf/2608.05747v1", "abstractEn": "Spatial intelligence is fundamental to embodied agents, yet existing benchmarks focus on local spatial perception from single or few viewpoints, overlooking global spatial awareness over continuous, long-horizon visual streams. To address this limitation, we introduce the Global-Spatial-Temporal Benchmark (GST-Bench), a VQA benchmark for global spatial intelligence in video understanding, comprising human-verified questions derived from 6,790 minutes of synthetically generated video. It requires models to perform accurate spatial inference from novel viewpoints unseen in the input video and to map egocentric observations onto global top-down images. A comprehensive evaluation of 22 state-of-the-art VLMs exposes a striking gap between models and humans: the strongest zero-shot model attains only 42.68, far below the human score of 79.08. To probe the cause of this gap, we construct GST-Bench-Local and find that models, despite strong local spatial understanding under the same task formulation, still fail to consolidate long-horizon observations into a globally consistent scene representation. We further provide GST-Train, a dataset for global spatial reasoning, as a complementary resource to facilitate future research on this challenge."}, {"seq": 42, "title": "AgentOPSD：面向智能体强化学习的递归自蒸馏方法", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "AgentOPSD 提出一种免评论家的递归回合级信用分配方法，将 token 级师生对数概率差聚合为回合级证据，并在 log-odds 空间递归更新贝叶斯信念状态，将稀疏结果监督转化为回合级信用信号。", "link": "https://arxiv.org/abs/2608.05987", "pdf": "https://arxiv.org/pdf/2608.05987v1", "abstractEn": "Reinforcement learning (RL) with verifiable rewards constructs trajectory-level advantage estimates, yet it often fails to credit the few pivotal decisions that determine outcomes in long-horizon, multi-turn agentic tasks. Recent work introduces privileged self-distillation for credit assignment, providing denser supervision, but it remains unclear how such local signals should represent sequential credit. We propose AgentOPSD, a critic-free, recursive method for turn-level credit assignment in agentic reinforcement learning. AgentOPSD aggregates token-level teacher-student log-probability gaps into turn-level evidence and recursively updates a Bayesian belief state in log-odds space. This yields a principled reweighting scheme that converts sparse outcome supervision into turn-level credit signals and identifies pivotal turns through the marginal belief revision between consecutive states. The method is fully compatible with standard policy optimization and requires neither an additional critic nor extra rollouts. We evaluate AgentOPSD on ALFWorld, WebShop, and Search-QA using Qwen2.5 models at two scales (3B and 7B). AgentOPSD outperforms GRPO and strong self-distillation baselines, achieving 89.1% success on ALFWorld with Qwen2.5-7B. Ablation studies attribute the gains to turn-level aggregation and history-dependent recursive belief updates."}, {"seq": 43, "title": "CalibForge：用对抗性求解器校准扩展可学习终端任务", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T02:55:46.759Z", "isPub": true, "summary": "CalibForge 提出一种自主终端任务合成系统，通过多求解器校准和对比校准，将任务构建为受约束的对抗性作者-求解器循环，使候选任务处于可证明可解但未被统一求解的\"可学习区\"。", "link": "https://arxiv.org/abs/2608.06352", "pdf": "https://arxiv.org/pdf/2608.06352v1", "abstractEn": "Training terminal agents requires executable and verifiable tasks that are not merely solvable, but appropriately challenging for learning. Executable validation establishes feasibility, yet does not reveal how a task behaves relative to a given solver setting. In this paper, we present CalibForge, an autonomous terminal-task synthesis system that uses verified solver behavior to revise candidate tasks through adversarial solver calibration. Multi-solver calibration targets disagreement within a heterogeneous solver pool, whereas contrastive solver calibration targets a designated strong-pass/weak-fail relation; both operationalize a solver-relative learnable zone anchored in demonstrated solvability. Using CalibForge, we construct 5,431 calibrated terminal tasks. Our ablations show that both strategies yield more effective supervision than authoring and validation alone or ordinary single-solver feedback. Models trained on the full collection achieve 32.58% and 47.57% on Terminal-Bench 2.0. The largest improvements over the corresponding base model reach 24.71 percentage points on Terminal-Bench 2.0, 27.68 points on SWE-bench Pro, and 30.04 points on Doc2Repo. Together, these results support solver-relative learnability as a practical target for constructing effective and transferable agent training data."}, {"seq": 44, "title": "斯坦福团队用 AI 首次设计完整病毒基因组，16 种新型噬菌体可杀死大肠杆菌", "badge": "IT之家", "srcType": "media", "ts": "2026-08-07T02:10:49.254Z", "isPub": true, "summary": "斯坦福大学研究人员使用 AI 技术首次成功设计出完整基因组，产出的 16 种新型噬菌体在实验室中可有效杀死大肠杆菌，不会对人类构成威胁。团队开发的 Evo1 和 Evo2 模型以病毒、细菌、植物和人类的遗传代码为训练数据，通过微调预测\"生命语言\"。研究被视为\"非常重要的转折点\"，或为抗生素耐药感染提供新治疗路径。", "link": "https://www.ithome.com/0/986/809.htm", "pdf": null, "abstractEn": null}, {"seq": 45, "title": "谷歌新论文：相似AI智能体可理性合作", "badge": "X · Rohan Paul", "srcType": "x", "ts": "2026-08-07T01:41:46.030Z", "isPub": true, "summary": "谷歌新论文提出，相似AI智能体即使无法沟通或未来无回报，也能基于\"自身选择可预测对方选择\"的推理实现理性合作，挑战经典博弈论对一次性囚徒困境中背叛的预测。Gemini和Gemma智能体在多种游戏后，相同模型合作率高，相关模型次之，随机对手多遭背叛。该\"嵌入均衡\"或能更好预测AI社会，但警示相似AI可能偏向同类而非人类。", "link": "https://x.com/rohanpaul_ai/status/2085541686646866105", "pdf": null, "abstractEn": null}, {"seq": 46, "title": "DeepAmbigQA：用于评测 LLM 答案完整性的歧义多跳问答基准", "badge": "Apple ML Research", "srcType": "research", "ts": "2026-08-07T00:53:19.682Z", "isPub": true, "summary": "苹果研究团队推出 DeepAmbigQA，一个用于评测大语言模型答案完整性的歧义多跳问答基准。该基准聚焦\"同名电影《盗火线》中哪位演员获得过奥斯卡奖\"这类复杂问题，要求模型同时区分同名实体并跨大量实体进行多跳推理。研究团队还发布了自动数据生成流程 DEEPAMBIGQAGEN，以构建此类评测数据。", "link": "https://machinelearning.apple.com/research/deepambigqa-multihop-questions", "pdf": null, "abstractEn": null}, {"seq": 47, "title": "Capek 0.5：面向具身智能的执行中心视觉语言模型", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T00:00:00.000Z", "isPub": true, "summary": "Capek 0.5 是一款以执行为中心的具身视觉语言模型，按功能角色将能力分为空间推理、时间理解、动作引导与状态验证四类，先由专家模型通过可验证奖励的强化学习分别习得，再经权重合并与策略蒸馏整合为单一推理模型。该模型提供 2B 与 35B-A3B 两种规模，在多数基准项上优于初始化版本，并新增状态验证基准 Capek-StateBench，同时保留全部四项专家能力并支持闭环具身任务执行。", "link": "https://arxiv.org/abs/2608.06756", "pdf": "https://arxiv.org/pdf/2608.06756v1", "abstractEn": "Vision-language models are increasingly serving as the reasoning core of embodied agents. Robot execution is inherently iterative: each action reshapes the scene and physical state, continually renewing what must be perceived, reasoned about, and verified. Meeting these demands requires complementary capabilities that differ in supervision signals, prediction formats, and verification criteria. Existing approaches typically develop these capabilities against isolated, task-specific objectives, leaving open how they should be organized and integrated around execution as a whole. We present Capek 0.5, an embodied vision-language model built around an execution-centric capability taxonomy. Rather than organizing training by datasets or tasks, the taxonomy groups embodied capabilities according to their functional roles throughout execution and comprises four capability families: Spatial Reasoning, Temporal Understanding, Action Guidance, and State Verification. Each capability is first acquired by a dedicated specialist through reinforcement learning with verifiable rewards from a shared backbone, and the specialists are then consolidated into a single inference-time model through weight-space merging followed by routed policy-space distillation. We instantiate Capek 0.5 at the 2B and 35B-A3B scales and evaluate it from three complementary perspectives: comprehensive benchmark suites including Capek-StateBench, a new benchmark for state verification; a controlled study of capability retention from specialists to the unified model; and closed-loop evaluation in simulated embodied environments. Capek 0.5 improves the large majority of matched benchmark rows over its initialization, retains all four specialized capabilities in one checkpoint with quantified losses, and transfers to closed-loop embodied task execution."}, {"seq": 48, "title": "零差距并非恢复：基准污染的分层逐题概率评估与逐步缓解", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T00:00:00.000Z", "isPub": true, "summary": "论文提出SA-PPG分层逐题概率差距评估法，通过采样估计每题求解概率并与干净模型逐题对比，揭示现有G-AP指标存在缺陷，导致此前污染缓解策略的恢复效果被显著高估。研究还提出RailCap缓解策略，在生成中限制回落到贪心轨迹的下一token为次优选项，在多个受污染模型和基准上取得最低SA-PPG。", "link": "https://arxiv.org/abs/2608.07341", "pdf": "https://arxiv.org/pdf/2608.07341v1", "abstractEn": "Test data from public benchmarks inevitably leaks into pretraining corpora, inflating evaluation scores once memorized. \\textbf{Contamination mitigation evaluation} intervenes in the decoding process to suppress memorization and restore a contaminated model's genuine capability, but its prevailing metric, the \\textbf{G-AP} (\\textbf{G}ap of \\textbf{A}ggregate \\textbf{P}erformance), is flawed. Discrete correct/incorrect readouts cannot characterize per-question performance, averaging before differencing lets over- and under-suppression cancel out, and uniform per-question weighting invites strategies to push solve probabilities onto the clean model's high-frequency values. We propose \\textbf{SA-PPG} (\\textbf{S}tratified \\textbf{A}ggregate of \\textbf{P}er-question \\textbf{P}robability \\textbf{G}aps): estimate each question's solve probability by sampling, difference it against the clean model per question, and aggregate within groups defined by the clean model's solve probability. Existing mitigation strategies first estimate where contamination lies and then operate on the estimate, so they are only as correct as the estimate. \\textbf{RailCap} instead judges contamination during generation: whenever a sample falls back onto the greedy trajectory, the next trajectory token is capped to the runner-up, accumulating suppression until the response distribution becomes sufficiently dispersed. Across multiple contaminated models and benchmarks, SA-PPG reveals that prior strategies' restoration is substantially overestimated, while RailCap attains the lowest SA-PPG."}, {"seq": 49, "title": "SimWAM：面向端到端自动驾驶的简易世界动作模型", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T00:00:00.000Z", "isPub": true, "summary": "SimWAM将视频生成仅用作训练信号，通过联合流匹配共训预训练视频专家与轻量动作专家，并在推理时丢弃视频分支，形成直接预测轨迹的独立规划器。该模型在NAVSIM上取得91.5 PDMS，超越现有基于WAM的规划器且延迟显著更低，并可零样本迁移至nuScenes。代码与模型权重已开源。", "link": "https://arxiv.org/abs/2608.07468", "pdf": "https://arxiv.org/pdf/2608.07468v1", "abstractEn": "World-Action Models (WAMs) improve end-to-end autonomous driving by transferring video dynamics priors to action prediction, but existing methods require costly future generation at inference. We present SimWAM, a simple yet effective WAM that uses video generation purely as a training signal. It co-trains a pretrained video expert and a lightweight action expert with joint flow matching. An isolated attention mask keeps action prediction independent of future frames, allowing the video branch to be discarded after training and leaving a self-contained planner that directly predicts trajectories. Since the two experts share no parameters and interact only through a unified attention interface, the video backbone could be replaced and the action expert scaled independently without modifying the learning objective or inference pipeline. We further apply reinforcement learning to optimize a compositional driving reward beyond trajectory imitation. Our SimWAM achieves $91.5$ PDMS on NAVSIM, surpasses state-of-the-art WAM-based planners with substantially lower latency, and transfers zero-shot to nuScenes. These results position SimWAM as a simple yet solid baseline that could readily benefit from advances in video generation for efficient autonomous driving. The code and model weights are available at https://github.com/H-EmbodVis/SimWAM/"}, {"seq": 50, "title": "YOLO-PEFT：面向 YOLO 系列的结构感知参数高效微调框架", "badge": "HuggingFace Daily", "srcType": "hf", "ts": "2026-08-07T00:00:00.000Z", "isPub": true, "summary": "YOLO-PEFT 提出将适配器放置形式化为可审计的约束规划问题，为实时检测器生成预算内的目标模块计划，或在训练前返回 Refuse。", "link": "https://arxiv.org/abs/2608.07051", "pdf": "https://arxiv.org/pdf/2608.07051v1", "abstractEn": "Generic parameter-efficient fine-tuning (PEFT) methods transferred from language models can fail silently on real-time detectors, whose heterogeneous operators and detection-specific components impose placement constraints absent from regular Transformer stacks. We propose YOLO-PEFT, a structure-aware framework that formulates adapter placement as an auditable constraint-planning problem. Given a detector graph, a PEFT request, and a resource budget, YOLO-PEFT assigns operator and semantic roles, evaluates explicit operator-validity, detector-semantic, graph-interface, and deployment predicates, records a reason code for each excluded module, and either emits a budgeted target-module plan or returns Refuse before training. Under the official VOC07+12 trainval-to-VOC07 test protocol, planner-selected RS-LoRA reaches 0.7138 and 0.7307 mAP50-95 on YOLO11s and YOLO12s, respectively, compared with 0.6428 and 0.6662 for Full-SFT. On RT-DETR-L, all seven evaluated LoRA-family configurations cross the predefined catastrophic threshold, supporting a calibrated Refuse-to-Full-SFT decision within the evaluated coverage. A controlled YOLO11 audit further shows that LoRA reduces peak training memory by 43.9 percent, although training takes 1.72 times longer. Within the evaluated detector families, placement policies, and calibration coverage, YOLO-PEFT replaces manual target-module trial and error with explicit, inspectable planning while preserving verified train-save-merge-export paths; refusal on unseen detector architectures remains an open validation problem. Project Page: github.com/Tencent/YOLO-Master"}]};
(function(){
  const papers = ARCHIVE.papers, meta = ARCHIVE.meta;
  // 统计卡
  document.getElementById('stat-total').textContent = meta.total;
  document.getElementById('stat-range').textContent = meta.earliest + ' ~ ' + meta.latest;
  document.getElementById('stat-pdf').textContent = meta.pdfCount;
  document.getElementById('stat-x').textContent = meta.xCount;

  // 相对时间（打开时刻实时计算）
  function relTime(iso){
    const t = new Date(iso).getTime();
    const now = Date.now();
    const s = Math.max(1, Math.floor((now - t)/1000));
    if(s<60) return s+' 秒前';
    const m = Math.floor(s/60); if(m<60) return m+' 分钟前';
    const h = Math.floor(m/60); if(h<24) return h+' 小时前';
    const d = Math.floor(h/24); if(d<30) return d+' 天前';
    return Math.floor(d/30)+' 个月前';
  }
  function beijingDate(iso){
    // 转北京时间 YYYY-MM-DD
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    return d.toISOString().slice(0,10);
  }
  function beijingTime(iso){
    const d = new Date(new Date(iso).getTime() + 8*3600*1000);
    return d.toISOString().slice(11,16);
  }

  // 按日期分组（北京时间）
  const groups = [];
  const map = {};
  papers.forEach(p=>{
    const day = beijingDate(p.ts);
    if(!map[day]){ map[day]={day,list:[]}; groups.push(map[day]); }
    map[day].list.push(p);
  });
  groups.sort((a,b)=> b.day < a.day ? -1 : 1);

  const tl = document.getElementById('timeline');
  const cards = document.getElementById('cards');
  const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  groups.forEach(g=>{
    const first = g.list[0];
    const div = document.createElement('div');
    div.className='tl-date';
    div.innerHTML = g.day + '<small>'+ beijingTime(first.ts) +' 起</small>';
    tl.appendChild(div);

    g.list.forEach(p=>{
      const linkAttr = p.link ? ('href="'+esc(p.link)+'" target="_blank" rel="noopener"') : '';
      // 卡片正文（摘要直接呈现）
      let html = '';
      html += '<article class="card" data-type="'+p.srcType+'">';
      html += '<div class="seq-wm">'+String(p.seq).padStart(2,'0')+'</div>';
      html += '<div class="card-head">'
            + '<span class="badge b-'+p.srcType+'">'+esc(p.badge)+'</span>'
            + '<span class="rel">'+relTime(p.ts)+'</span></div>';
      html += '<h3 class="title">'+esc(p.title)+'</h3>';
      html += '<p class="summary">'+esc(p.summary)+'</p>';

      // arXiv 完整英文摘要（内联展开）
      if(p.abstractEn){
        const aid = 'abs'+p.seq;
        html += '<button class="expand-btn" data-target="'+aid+'">展开原文摘要（英文）▾</button>';
        html += '<div class="abstract-en" id="'+aid+'" hidden>'+esc(p.abstractEn)+'</div>';
      }

      // 底部动作区
      html += '<div class="card-foot">';
      if(p.pdf){
        html += '<a class="pdf-link" href="'+esc(p.pdf)+'" target="_blank" rel="noopener">下载 PDF ↧</a>';
        html += '<a class="src-link" '+linkAttr+'>arXiv 原文 <span class="arw">↗</span></a>';
      } else if(p.srcType==='x'){
        // X：链接降为角落小字，注明需代理
        html += '<span class="proxy-note">原文发布于 X（国内需代理打开）：'
              + '<a href="'+esc(p.link)+'" target="_blank" rel="noopener">查看原帖 ↗</a></span>';
      } else if(p.link){
        html += '<a class="src-link" '+linkAttr+'>查看原文 <span class="arw">↗</span></a>';
      }
      html += '</div>';
      html += '</article>';
      cards.insertAdjacentHTML('beforeend', html);
    });
  });

  // 展开/收起英文摘要
  document.querySelectorAll('.expand-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.target);
      const hidden = el.hasAttribute('hidden');
      if(hidden){ el.removeAttribute('hidden'); btn.textContent='收起原文摘要（英文）▴'; }
      else { el.setAttribute('hidden',''); btn.textContent='展开原文摘要（英文）▾'; }
    });
  });

  // 滚动渐入
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.08, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
})();
</script>
</body>
</html>
