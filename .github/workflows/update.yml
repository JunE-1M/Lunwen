name: 每周二更新 AI 论文档案库

on:
  push:
    branches: [main]
  schedule:
    # 北京时间每周二 08:00（UTC 周二 00:00）
    - cron: "0 0 * * 2"
  workflow_dispatch: {}

# 部署 Pages 需要 pages 与 id-token 权限；提交更新需要 contents: write
permissions:
  contents: write
  pages: write
  id-token: write

# 防止并行运行互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 重新生成档案库
        run: python3 update.py --download-pdf

      - name: 提交更新
        run: |
          git config user.name "ai-paper-archive-bot"
          git config user.email "bot@ai-paper-archive.local"
          git add www/index.html archive.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每周自动更新论文档案库（重点论文）"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
